name: Release

on:
  push:
    tags: ['v[0-9]*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release to verify (does not republish)
        default: v0.1.0
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    if: github.event_name == 'push'
    uses: ./.github/workflows/ci.yml
  release:
    if: github.event_name == 'push'
    needs: checks
    runs-on: macos-15
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify release tag and main history
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 -B Scripts/release.py validate --tag "$RELEASE_TAG"
          git merge-base --is-ancestor HEAD origin/main
      - name: Install pinned CI signing identity
        timeout-minutes: 3
        env:
          RELEASE_CERTIFICATE_BASE64: ${{ secrets.RELEASE_CERTIFICATE_BASE64 }}
          RELEASE_CERTIFICATE_PASSWORD: ${{ secrets.RELEASE_CERTIFICATE_PASSWORD }}
          RELEASE_CERTIFICATE_SHA1: ${{ secrets.RELEASE_CERTIFICATE_SHA1 }}
        run: python3 -B Scripts/ci_signing.py install
      - name: Build and verify arm64 app
        run: |
          bash build.sh
          python3 -B Tests/Integration/test_signing_identity.py
          python3 -B Tests/Integration/test_mcp_queries.py 'dist/微迹.app/Contents/MacOS/WeChatListener'
          python3 -B Tests/Integration/test_mcp_http.py 'dist/微迹.app/Contents/MacOS/WeChatListener'
          python3 -B Tests/Integration/test_mcp_stdio.py 'dist/微迹.app/Contents/MacOS/WeChatListener'
          python3 -B Tests/Integration/test_mcp_stdio.py 'dist/微迹.app/Contents/MacOS/WeChatListener' --http
      - name: Package ZIP, DMG and checksums
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 -B Scripts/release.py package --tag "$RELEASE_TAG"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Weiji-${{ github.ref_name }}-release
          path: |
            dist/release/*
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      - name: Publish completed release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 -B Scripts/release.py publish --tag "$RELEASE_TAG"
      - name: Remove temporary signing keychain
        if: always()
        timeout-minutes: 3
        run: python3 -B Scripts/ci_signing.py cleanup
  verify:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: macos-15
    timeout-minutes: 10
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install pinned CI signing identity
        timeout-minutes: 3
        env:
          RELEASE_CERTIFICATE_BASE64: ${{ secrets.RELEASE_CERTIFICATE_BASE64 }}
          RELEASE_CERTIFICATE_PASSWORD: ${{ secrets.RELEASE_CERTIFICATE_PASSWORD }}
          RELEASE_CERTIFICATE_SHA1: ${{ secrets.RELEASE_CERTIFICATE_SHA1 }}
        run: python3 -B Scripts/ci_signing.py install
      - name: Verify signing and published assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          python3 -B Tests/Integration/test_signing_identity.py
          python3 -B Scripts/release.py verify --tag "$RELEASE_TAG"
      - name: Remove temporary signing keychain
        if: always()
        timeout-minutes: 3
        run: python3 -B Scripts/ci_signing.py cleanup
